[project]
name = "wheel-size-mcp"
version = "0.5.0"
description = "MCP server for Wheel Fitment API — enables Claude Code and LLM agents to query vehicle wheel/tire compatibility data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "WHEEL SIZE KZ LLP", email = "info@wheel-size.com" },
]
keywords = ["mcp", "claude-code", "wheel-fitment", "fastmcp", "wheel-size"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://www.wheel-size.com"
Repository = "https://github.com/driveate/wheel-size-mcp"
Issues = "https://github.com/driveate/wheel-size-mcp/issues"
Documentation = "https://developer.wheel-size.com"
"API Reference" = "https://api.wheel-size.com/v2/openapi/"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]
evals = [
    "anthropic>=0.40",
]

[project.scripts]
wheel-size-mcp = "ws_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require the live local API (api.ws.local)",
]
